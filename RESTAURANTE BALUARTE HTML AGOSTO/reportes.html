<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reportes | Restaurante Baluarte</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/gestion.css"></head>
