<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Restaurante Baluarte</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login">

        <!-- LADO IZQUIERDO -->

        <div class="left">

            <img src="img/logo2.png" class="food" alt="Restaurante Baluarte">

            <div class="left-overlay">

                <h2>Restaurante Baluarte</h2>

                <p>Sistema de gestión integral para tu negocio</p>

            </div>

        </div>

        <!-- LADO DERECHO -->

        <div class="right">

            <div class="number">

                01

            </div>

            <h1>Iniciar Sesión</h1>

            <div class="line"></div>

            <p>

                Bienvenido de nuevo al Sistema de Gestión Restaurante Baluarte

            </p>

            <form>

                <label>Usuario</label>

                <div class="input">

                    <i class="fa-solid fa-user"></i>

                    <input type="text" placeholder="Ingresa tu usuario">

                </div>

                <label>Contraseña</label>

                <div class="input">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" placeholder="Ingresa tu contraseña">

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Recordarme

                    </label>

                    <a href="#">¿Olvidaste tu contraseña?</a>

                </div>

                <button type="submit">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Iniciar Sesión

                </button>

            </form>

            <footer>

                © 2026 Restaurante Baluarte

            </footer>

        </div>

    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
