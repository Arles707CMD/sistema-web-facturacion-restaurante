<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Configuración | Restaurante Baluarte</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/gestion.css"></head>
<body><main class="gestion"><header class="gestion-header"><div><p>Restaurante Baluarte</p><h1>Configuración</h1></div><a class="btn-gestion btn-secundario" href="index.html">Volver al dashboard</a></header>
<section class="gestion-panel"><h2>Datos del negocio</h2><form class="gestion-form" id="formConfiguracion"><label for="nombreRestaurante">Nombre del restaurante</label><input id="nombreRestaurante" required><label for="metaMensual">Meta mensual de ventas</label><input id="metaMensual" type="number" min="0" required><label for="ivaConfiguracion">IVA (%)</label><input id="ivaConfiguracion" type="number" min="0" max="100" required><div class="gestion-actions"><button class="btn-gestion" type="submit">Guardar cambios</button><button class="btn-gestion btn-secundario peligro" type="button" id="reiniciarDatos">Restablecer datos</button></div></form></section>
</main><script src="js/data.js"></script><script src="js/configuracion.js"></script></body></html>
